<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>算电通 - AI数据中心电力交易智能分析平台</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/enhanced.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
</head>
<body>
  <div id="app">
    <!-- 侧边导航 -->
    <aside class="sidebar">
      <div class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
          </svg>
        </div>
        <div class="logo-text">
          <h1>算电通</h1>
          <span>AI数据中心电力交易平台</span>
        </div>
      </div>
      <nav class="nav-menu" id="navMenu"></nav>
      <div class="sidebar-footer">
        <div class="status-indicator">
          <span class="status-dot online"></span>
          <span>系统运行中</span>
        </div>
        <div class="version">v1.0.0</div>
      </div>
    </aside>

    <!-- 主内容区 -->
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <h2 id="pageTitle">市场总览</h2>
          <span class="page-subtitle" id="pageSubtitle"></span>
        </div>
        <div class="topbar-right">
          <div class="datetime" id="datetime"></div>
          <div class="topbar-icon" id="notifBell" title="通知">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
              <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
              <path d="M13.73 21a2 2 0 01-3.46 0"/>
            </svg>
            <span class="notif-badge" id="notifBadge">4</span>
          </div>
          <div class="location-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/>
              <circle cx="12" cy="10" r="3"/>
            </svg>
            广东电力现货市场
          </div>
        </div>
        <!-- 通知面板 -->
        <div class="notif-panel" id="notifPanel">
          <div class="notif-header">
            <span>通知中心</span>
            <button class="notif-clear" id="notifClear">全部已读</button>
          </div>
          <div class="notif-list" id="notifList"></div>
        </div>
      </header>
      <div class="page-container" id="pageContainer"></div>
    </main>
  </div>

  <!-- AI交易助手悬浮窗 -->
  <div class="ai-widget" id="aiWidget">
    <div class="ai-fab" id="aiFab" title="AI交易助手">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24">
        <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
      </svg>
      <span class="ai-fab-badge">AI</span>
    </div>
    <div class="ai-panel" id="aiPanel">
      <div class="ai-header">
        <div class="ai-avatar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
          </svg>
        </div>
        <div>
          <div class="ai-title">AI交易助手</div>
          <div class="ai-status"><span class="status-dot online"></span>在线 · 随时为您服务</div>
        </div>
        <button class="ai-close" id="aiClose">✕</button>
      </div>
      <div class="ai-messages" id="aiMessages"></div>
      <div class="ai-quick" id="aiQuick">
        <button class="ai-quick-btn" data-q="明天现货怎么申报？">明天怎么申报</button>
        <button class="ai-quick-btn" data-q="绿电缺口多少？怎么补？">绿电缺口</button>
        <button class="ai-quick-btn" data-q="当前电价和峰谷时段？">电价查询</button>
        <button class="ai-quick-btn" data-q="需求响应能赚多少？">需求响应收益</button>
      </div>
      <div class="ai-input-area">
        <input type="text" id="aiInput" placeholder="输入问题，如：明天怎么申报..." />
        <button id="aiSend">发送</button>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/pages/workbench.js"></script>
  <script src="/js/pages/overview.js"></script>
  <script src="/js/pages/price.js"></script>
  <script src="/js/pages/load.js"></script>
  <script src="/js/pages/strategy.js"></script>
  <script src="/js/pages/contract.js"></script>
  <script src="/js/pages/green.js"></script>
  <script src="/js/pages/dr.js"></script>
  <script src="/js/pages/settlement.js"></script>
  <script src="/js/pages/calendar.js"></script>
  <script src="/js/pages/feishu.js"></script>
  <script src="/js/ai-chat.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
